<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Disaster dashboard has moved — Tabang</title>
    <!--
      The previous contents of this page displayed hardcoded disaster figures
      under a "Live" badge: 128,750 people affected, 27,450 evacuated, and
      similar totals that no part of this system could count. Presenting
      invented numbers as live operational data during a flood is dangerous,
      so the page has been retired rather than restyled.

      The replacement counts only what the deployment actually holds, states
      when it counted, and says plainly which figures it cannot provide.
    -->
    <meta http-equiv="refresh" content="0; url=/responder">
</head>
<body>
    <main>
        <h1>The disaster dashboard has moved</h1>
        <p>
            The figures previously shown here were placeholders, not live data.
            The responder workspace now shows counts taken from real records,
            with the time they were counted.
        </p>
        <p><a href="/responder">Open the responder workspace</a></p>
        <p><a href="/app">Back to the resident app</a></p>
    </main>
</body>
</html>
