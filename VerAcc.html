<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Responder verification has moved — Tabang</title>
    <!--
      The previous contents of this page let a signed-out visitor create a
      responder record directly from the browser, which was an authorization
      hole rather than a verification step. Responder access is now granted
      only by a reviewer, and the application lives behind a signed-in route.
    -->
    <meta http-equiv="refresh" content="0; url=/app/responder-application">
</head>
<body>
    <main>
        <h1>Responder verification has moved</h1>
        <p>
            Responder access is now reviewed before it is granted. Sign in and
            open the responder application to apply.
        </p>
        <p><a href="/app/responder-application">Go to the responder application</a></p>
    </main>
</body>
</html>
