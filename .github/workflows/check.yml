name: check

on:
  push:
    branches: ["**"]
  pull_request:

# No deployment happens here. Releasing migrations or hosting stays a deliberate
# human action, because both change what real residents and responders see.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Scan for committed secrets
        run: npm run scan:secrets

      - name: Colour contrast
        run: npm run check:contrast

      - name: Unit tests
        run: npm run test:unit

      - name: Server tests
        run: npm run test:server

      - name: Build
        run: npm run build

  integration:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: tabang
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Apply migrations
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/tabang
        run: npm run db:migrate

      - name: Integration tests
        env:
          DATABASE_URL: postgres://postgres:password@localhost:5432/tabang
        run: npm run test:integration
