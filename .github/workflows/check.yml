name: check

on:
  push:
    branches: ["**"]
  pull_request:

# No deployment happens here. Releasing migrations or hosting stays a deliberate
# human action, because both change what real residents and responders see.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Scan for committed secrets
        run: npm run scan:secrets

      - name: Colour contrast
        run: npm run check:contrast

      - name: Unit tests
        run: npm run test:unit

      - name: Server tests
        run: npm run test:server

      - name: Build
        run: npm run build

  policies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - run: npm ci

      - name: Start local Supabase
        run: npm run supabase:start

      - name: Rebuild local database from migrations
        run: npm run supabase:reset

      - name: Export local Supabase settings
        run: |
          npx supabase status -o env \
            --override-name api.url=SUPABASE_URL \
            --override-name auth.publishable_key=VITE_SUPABASE_PUBLISHABLE_KEY \
            --override-name auth.secret_key=SUPABASE_SECRET_KEY \
            | grep -E '^(SUPABASE_URL|VITE_SUPABASE_PUBLISHABLE_KEY|SUPABASE_SECRET_KEY)=' \
            | tr -d '"' >> "$GITHUB_ENV"

      - name: Database policies and real repositories
        run: npm run test:policies
